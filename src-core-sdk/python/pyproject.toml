[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koma-sdk"
version = "0.1.0"
description = "Typed asynchronous client for the Koma headless SDK adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[tool.setuptools]
packages = ["koma_sdk"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
koma_sdk = ["py.typed"]
